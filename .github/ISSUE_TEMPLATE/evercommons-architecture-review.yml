name: EverCommons architecture review
description: Review RFC-0004 backend, feed, media integration, cost, and repo-split decisions.
title: "EverCommons architecture review: "
labels: ["review", "architecture", "privacy-security"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for public review of RFC-0004. Do not post secrets, personal data, exploit payloads, or private abuse evidence. This RFC does not set a launch date and does not enable public uploads.
    10|  - type: dropdown
    id: area
    attributes:
      label: Review area
      options:
        - Repo split timing
        - Shield vs app boundary
        - Feed / discovery ranking
        - Upload integration
        - Storage path A vs B
        - Moderation / appeals
        - Export / deletion
        - Cost / kill switch
        - Account abuse / recovery
        - Vendor lock-in
        - Public wording / claims
    validations:
      required: true
  - type: textarea
    id: concern
    attributes:
      label: Concern or recommendation
      description: Describe the specific risk, ambiguity, or improvement.
    validations:
      required: true
  - type: textarea
    id: suggested-change
    attributes:
      label: Suggested change
      description: Link to RFCs, standards, provider docs, or source paths where helpful.
